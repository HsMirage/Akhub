# Akhub 反代示例（Nginx，§25.2）。
#
# 放置：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/akhub.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书推荐用 certbot 申请（它会自己往这个 server 块里插 ssl_certificate 指令）：
#   sudo certbot --nginx -d akhub.example.com

# 限流：Akhub 内部按账号做 RPM/TPM 限流（§13），这里只防暴力破解与误配置。
# 定义在 http 上下文里，所以放在文件顶层（conf.d 是被 include 进 http 的）。
limit_req_zone $binary_remote_addr zone=akhub_admin:10m rate=10r/s;

# SSE 是长连接：上游读超时必须大于 Akhub 的 AKHUB_REQUEST_TIMEOUT_SECS（默认 600）。
proxy_read_timeout 600s;
proxy_send_timeout 600s;

upstream akhub_backend {
    # 单实例部署，没有负载均衡；写在这里是为了集中管理超时与保活。
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name akhub.example.com;
    # certbot 会自动把下面的注释换成跳转 HTTPS；先保留明文跳转。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name akhub.example.com;

    # certbot --nginx 会填好这两行；手工管理证书时自己改。
    # ssl_certificate     /etc/letsencrypt/live/akhub.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/akhub.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 必须与 Akhub 的 AKHUB_MAX_REQUEST_BYTES（默认 64 MiB）保持一致或更大。
    # 比它小的话，大图请求会在到达网关前就被 Nginx 413 掉，错误信息也指不到
    # 真正的原因。
    client_max_body_size 64m;

    # 不加这个头，Akhub 就不知道自己是在 HTTPS 后面，会话 Cookie 不会带
    # Secure（§23.2）。这三个头是必须的，不要删。
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Host              $host;

    # SSE / 长流式响应：必须关掉缓冲，否则事件会被 Nginx 攒着不发，
    # 客户端的"首字延迟"会变成"整段延迟"。
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://akhub_backend;
    }

    # 管理后台入口加一层限流，避免有人对着登录页暴力猜密码。
    # burst 给正常操作留出余量：后台一次页面加载会并发好几个接口。
    location /admin/api/auth/ {
        limit_req zone=akhub_admin burst=30 nodelay;
        proxy_pass http://akhub_backend;
    }

    # 健康检查不写访问日志：容器/监控每秒都在探，会把日志淹掉。
    location /health/ {
        access_log off;
        proxy_pass http://akhub_backend;
    }
}
