[Definition]
# 2026-11-11 事件：/admin/api/auth/login 被暴力破解（4.8 万次，全部 401，未猜中）。
#
# 注意两个坑：
#  1) <HOST> 已自带行首锚定，前面不要写 ^；
#  2) 不要用 \[[^\]]+\] 这种方括号字符类 —— fail2ban 的配置解析会把
#     方括号当语法处理，导致 failregex 恒不命中（实测 3 行样本 0 matched）。
#     这里改用 .* 跳过 [time_local]，等价且稳。
failregex = <HOST> .*"POST /admin/api/auth/login HTTP/[0-9.]+" (?:401|429)
ignoreregex =
