# Akhub 部署编排（§25.1）。
#
# 三种用法：
#   1. 开箱即用（推荐）：从 GHCR 拉预构建多架构镜像
#        AKHUB_IMAGE=ghcr.io/hsmirage/akhub:latest docker compose up -d
#   2. 就地构建：`docker compose up -d --build`
#   3. 配合反代：见 deploy/Caddyfile 与 deploy/nginx.conf，再把 AKHUB_BIND 改成 0.0.0.0
#
# 首次启动后打开 http://127.0.0.1:8080/admin 设置管理员密码。

services:
  akhub:
    image: ${AKHUB_IMAGE:-ghcr.io/hsmirage/akhub:latest}
    build:
      context: .
      target: runtime
    container_name: akhub
    restart: unless-stopped

    # Docker 默认只给 10 秒停止宽限，会 SIGKILL 掉在途的长流式请求。
    # 这里必须大于等于 AKHUB_SHUTDOWN_GRACE_SECS（默认 180 秒，§25.3）。
    stop_signal: SIGTERM
    stop_grace_period: 200s

    ports:
      # 默认只绑定环回地址；生产环境请由 Caddy / Nginx 终止 HTTPS 后反代过来。
      # 需要让同网段的容器直接访问时改成 "0.0.0.0:8080:8080"。
      - "${AKHUB_BIND:-127.0.0.1}:${AKHUB_PORT:-8080}:8080"

    volumes:
      # 唯一持久卷：SQLite、主密钥与临时目录。
      #
      # 必须用命名卷：Docker 会把镜像里 /data 的属主（uid 10001）带到卷上，
      # 容器内的非 root 用户才能写主密钥与数据库。若改成 bind mount
      #（例如 `./data:/data`），宿主目录必须先 `chown 10001:10001`，
      # 否则启动会以「创建主密钥文件失败：Permission denied」退出。
      - akhub-data:/data

    environment:
      AKHUB_LISTEN: 0.0.0.0:8080
      AKHUB_DATA_DIR: /data
      RUST_LOG: ${RUST_LOG:-akhub=info,warn}
      # 想让主密钥脱离数据目录管理时，取消下面一行的注释并填入 32 字节 hex：
      # AKHUB_MASTER_KEY: ""

    # 日志轮转：默认的 json-file 驱动不限制大小，长期运行会把宿主磁盘写满。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "/usr/local/bin/akhub", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # 网关是唯一对外入口，不需要额外能力；`no-new-privileges` 让提权路径失效。
    security_opt:
      - no-new-privileges:true

volumes:
  # Docker 首次创建时继承镜像里 /data 的属主，开箱即用。
  akhub-data:
    # 需要固定卷名（便于外部备份脚本引用）时取消注释：
    # name: akhub-data
