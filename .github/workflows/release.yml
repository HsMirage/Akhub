# 公开发版：推 v* tag 时产出桌面安装包 + Linux 单文件二进制 + Docker 镜像。
#
# 挂到 Release 上的只有这几个（2026-11-21 起的口径：只发 linux-x86_64 与 windows-x86_64）：
#   akhub-desktop-<tag>-windows-x86_64-setup.exe   Windows 桌面端（NSIS 安装器）
#   akhub-v<tag>-linux-x86_64.tar.gz               Linux 服务端
#   checksums.txt                                  上面这些文件的 sha256
#
# **linux-aarch64 不再构建**（2026-11-21 起）：线上与客户全是 x86_64，arm 产物
# 只白占构建时间。历史 Release 上的 aarch64 资产不删，但新版本不再产出。
#
# **macOS 不再构建、不再发布**（2026-10-20 起）：本项目只保留 Linux 与 Windows
# 两个平台。早于该日期的 Release 上仍有 macOS 的 .dmg 历史资产，它们不会被删除，
# 但新版本不再产出。
#
# Windows 不发裸二进制：它的产品形态是桌面端应用，二进制只在 windows runner 上
# 编出来作为桌面端的 sidecar 使用，不挂到 Release。Windows 的 .msi 也不打——
# 只留一个双击即装的 setup.exe，安装入口只有一个。
#
# 镜像推送到 GHCR（ghcr.io/<owner>/<repo>），配置了 Docker Hub 变量时再镜像一份过去。
#
# 管理后台必须在 cargo 之前构建：rust-embed 在编译期把它嵌进二进制。
name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发只跑构建，不发 Release（下面的 release / docker job 判断了 is_release）。
  workflow_dispatch:
  # 由 pr-release.yml 在 PR 合并且版本升级时自动创建 tag 后调用。
  workflow_call:
    inputs:
      tag:
        description: "本次发布的版本 tag（例如 v1.1.58）"
        required: true
        type: string
      pr_number:
        description: "触发本次发布的 PR 编号（可选，用于生成 Release 说明）"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # npm ci 比 npm install 慢一点，但可复现；发布链路不能容忍依赖漂移。
  NPM_CONFIG_FUND: "false"

jobs:
  # ---------------------------------------------------------------- 前置校验
  verify:
    name: 版本一致性
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: 确定发布 tag 并校验 Cargo.toml 版本一致性
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
            is_release="true"
          elif [[ "$EVENT_REF" == refs/tags/v* ]]; then
            tag="$EVENT_REF_NAME"
            is_release="true"
          else
            tag="v${crate}"
            is_release="false"
          fi
          echo "tag=$tag is_release=$is_release crate=$crate"
          if [[ "$is_release" == "true" ]]; then
            ver="${tag#v}"
            if [[ "$ver" != "$crate" ]]; then
              echo "::error::tag ${tag} 与 Cargo.toml 的 $crate 不一致；二进制里的 /admin 版本号和 --version 都会对不上"
              exit 1
            fi
          else
            echo "非正式发版触发（${EVENT_REF}），跳过 tag 校验并仅做构建演练"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

      # 平台上限：只发 Linux 与 Windows。ci.yml 里有同一道门禁，但 tag 发版
      # 不会经过 ci.yml，所以这里必须再卡一次——否则一条 darwin 目标就能悄悄
      # 混进公开发版。实现只在 scripts/check-platforms.sh 里。
      - name: 平台上限
        run: ./scripts/check-platforms.sh

      # 桌面端是独立 crate（desktop/），版本号手写在它自己的 Cargo.toml 里：
      # 一旦掉队，安装包版本就会和服务端对不上。这里提前卡住，别等用户装完才发现。
      - name: desktop 版本必须与根 crate 一致
        run: |
          set -euo pipefail
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          desktop="$(grep -m1 '^version' desktop/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "crate=$crate desktop=$desktop"
          if [[ "$desktop" != "$crate" ]]; then
            echo "::error::desktop/Cargo.toml 的 $desktop 与根 Cargo.toml 的 $crate 不一致"
            exit 1
          fi

  # ---------------------------------------------------------------- 前端产物
  web:
    name: 管理后台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建
        working-directory: web
        run: |
          npm ci
          # 纯逻辑的行为断言（批量粘贴 Key 的切分规则）与构建同一份依赖，
          # 顺路跑一次；发版链路不接受"规则退化了没人发现"。
          npm test
          npm run build

      # 六个平台共用同一份前端产物：各平台分别 npm ci 会拖慢发版，也可能
      # 因为 registry 抖动产出版本不同的壳子。
      - uses: actions/upload-artifact@v4
        with:
          name: akhub-web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- 二进制
  # 两个平台都要编：Linux 那份是发布资产，Windows 那份是桌面端 sidecar 的来源
  # （见下面的 desktop job），编完只留在 workflow artifact 里，不上 Release。
  binaries:
    name: ${{ matrix.name }}
    needs: [web, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: akhub-web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 打包规则只在 scripts/package.sh 里定义一次：CI 与本地发版共用同一份
      # 实现，资产命名（akhub-<tag>-<platform>）与归档内层目录才不可能分叉。
      # Windows 上用 Git Bash 跑它；那边只产裸 exe，没有归档。
      - name: 打包
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          TAG="${RELEASE_TAG:-v$VERSION}"
          BINARY="target/${{ matrix.target }}/release/akhub"
          if [[ "${{ matrix.target }}" == *windows* ]]; then BINARY="$BINARY.exe"; fi
          AKHUB_TAG="$TAG" ./scripts/package.sh \
            "${{ matrix.target }}" "${{ matrix.name }}" "$BINARY"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: akhub-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.exe
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- 桌面端
  # Tauri v2 外壳：sidecar 用的 akhub 二进制直接复用 binaries job 的发行工件
  # （Windows 的裸 exe），不在这里重编译一遍——这样「桌面端里跑的 akhub」与用户
  # 手工下载的那个一定是同一份产物。
  #
  # 只构建 Windows：macOS 从 2026-10-20 起不再产出。
  #
  # 不签名（仓库没有 Windows 代码签名证书）：首次运行需要过 SmartScreen 的
  # 「仍要运行」。具体步骤写在 desktop/README.md。
  desktop:
    name: desktop-${{ matrix.name }}
    needs: [verify, binaries]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-asset: akhub-windows-x86_64
            # 只打 NSIS：安装入口留一个就够，.msi 不再产出。
            bundles: nsis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary-asset }}
          path: sidecar-dist

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 桌面 crate 是独立 workspace，缓存也走它自己的 target/。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: desktop-${{ matrix.target }}

      - name: 安装 Tauri CLI
        working-directory: desktop
        run: npm ci

      # utilities-rust 的三元组命名只在这一个脚本里定义：CI 与本地共用同一份实现。
      - name: 准备 sidecar
        shell: bash
        run: |
          set -euo pipefail
          src="$(ls sidecar-dist/*.exe | head -n1)"
          echo "sidecar 来源：$src"
          ./desktop/prepare-sidecar.sh "${{ matrix.target }}" "$src"
          ls -l desktop/binaries

      - name: 构建桌面端
        working-directory: desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 产物统一改名成 akhub-desktop-<tag>-<platform>.<ext>：用户从 Release 页面
      # 一眼就能看出是哪个平台、什么版本。
      - name: 归集产物
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          TAG="${RELEASE_TAG:-v$VERSION}"
          BUNDLE="desktop/target/${{ matrix.target }}/release/bundle"
          # Tauri 在有 --target 时把产物放在 <target-dir>/<triple>/release/bundle；
          # 万一将来布局变了，退回到不带三元组的那层，避免整条发版卡在一个路径上。
          if [[ ! -d "$BUNDLE" ]]; then BUNDLE="desktop/target/release/bundle"; fi
          mkdir -p dist-desktop
          cp "$BUNDLE"/nsis/*-setup.exe "dist-desktop/akhub-desktop-$TAG-${{ matrix.name }}-setup.exe"
          ls -l dist-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: akhub-desktop-${{ matrix.name }}
          path: dist-desktop/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  release:
    name: 生成 Release
    # 桌面产物与 Linux 二进制进同一个 Release：checksums.txt 得把它们一起算上。
    needs: [verify, binaries, desktop]
    if: needs.verify.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: akhub-*
          path: dist
          merge-multiple: true

      # 只对真正要发布的那几个文件算：下载下来的中间产物（Windows 的裸二进制）
      # 不挂 Release，也就不该出现在校验和里。
      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.txt
          shopt -s nullglob
          targets=(
            ./akhub-v*-linux-x86_64.tar.gz
            ./akhub-desktop-*-windows-x86_64-setup.exe
          )
          shopt -u nullglob
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::没有匹配到任何发布产物，拒绝生成空的 checksums.txt"
            exit 1
          fi
          # 校验和文件本身不能被算进去。
          sha256sum "${targets[@]}" > checksums.txt
          cat checksums.txt

      # Release 说明优先取关联 PR 的标题与正文（过滤模板注释与勾选段）；
      # 若非 PR 合入（例如手动直接推 tag），回退到「发布 vX.Y.Z」提交正文或 HEAD 提交。
      - name: 生成 Release 说明
        id: notes
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          commit="$(git rev-parse HEAD)"

          pr_number="${INPUT_PR_NUMBER}"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api "repos/${REPO}/commits/${commit}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "master")] | sort_by(.merged_at) | last | .number // empty' 2>/dev/null || true)"
          fi

          title=""
          body=""
          if [[ -n "$pr_number" ]]; then
            pr_json="$(gh api "repos/${REPO}/pulls/${pr_number}" 2>/dev/null || true)"
            if [[ -n "$pr_json" ]]; then
              pr_title="$(printf '%s' "$pr_json" | jq -r '.title // empty')"
              pr_body="$(printf '%s' "$pr_json" | jq -r '.body // empty')"
              # 清理 HTML 注释与 PR 模板末尾的「发版确认」勾选段，保留面向用户的说明。
              cleaned_body="$(PR_BODY="$pr_body" python3 - <<'PY'
          import os, re
          text = os.environ.get("PR_BODY", "")
          text = re.sub(r"<!--.*?-->", "", text, flags=re.S)
          text = re.sub(r"\n##\s*发版确认[\s\S]*$", "", text)
          lines = [line.rstrip() for line in text.splitlines()]
          while lines and not lines[0].strip():
              lines.pop(0)
          while lines and not lines[-1].strip():
              lines.pop()
          print("\n".join(lines))
          PY
          )"
              if [[ -n "$pr_title" ]]; then
                clean_title="${pr_title#发布 }"
                if [[ "$clean_title" == *"$tag"* || "$clean_title" == *"$version"* ]]; then
                  title="$clean_title"
                else
                  title="${tag}：${clean_title}"
                fi
              fi
              body="$cleaned_body"
            fi
          fi

          if [[ -z "$title" ]]; then
            # 回退：找形如「发布 v1.1.30：…」的那条提交。
            release_commit="$(git log --format=%H \
              --grep="^发布 v${version}：\|^发布 v${version}$" -1 || true)"
            if [[ -n "$release_commit" ]]; then
              commit="$release_commit"
            fi
            subject="$(git log --format=%s -1 "$commit")"
            body="$(git log --format=%b -1 "$commit")"
            title="${subject#发布 }"
          fi

          echo "commit=$commit"
          echo "pr_number=${pr_number:-none}"
          echo "title=$title"
          {
            echo "title<<AKHUB_TITLE_EOF"
            printf '%s\n' "$title"
            echo "AKHUB_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

          prev="$(git describe --tags --abbrev=0 "${commit}^" 2>/dev/null || true)"
          {
            if [[ -n "${body//[[:space:]]/}" ]]; then
              printf '%s\n' "$body"
            else
              printf '%s\n' "$title"
            fi
            echo
            echo "---"
            if [[ -n "$pr_number" ]]; then
              echo "**发布 PR**：#${pr_number}"
            fi
            if [[ -n "$prev" && "$prev" != "$tag" ]]; then
              echo "**完整改动**：https://github.com/${REPO}/compare/${prev}...${tag}"
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "--- 生成的 Release 说明 ---"
          cat "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/akhub-v*-linux-x86_64.tar.gz
            dist/akhub-desktop-*-windows-x86_64-setup.exe
            dist/checksums.txt
  # ---------------------------------------------------------------- 容器镜像
  # 只发 amd64（2026-11-21 起不再编 arm64）。
  #
  # 单架构阶段先推 <tag>-<arch>；不带后缀的 tag 由后面的 manifest 步骤指向它，
  # 这样下游 compose 里的 image: <tag> 走的始终是 manifest。
  docker:
    name: 镜像 linux/${{ matrix.arch }}
    needs: [verify, web]
    if: needs.verify.outputs.is_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 就地带上前端产物：Dockerfile 里的 node 阶段仍会重建一次，
      # 但这样 `docker build .` 这条本地路径和 CI 才完全同构。
      - uses: actions/download-artifact@v4
        with:
          name: akhub-web-dist
          path: web/dist

      - uses: docker/setup-buildx-action@v3

      # 用脚本而不是 `if: secrets.X != ''`：GitHub 明确不建议在表达式里
      # 引用 secret，空值判断在 shell 里做既可靠又不会把值打进日志。
      - name: 取镜像仓库列表
        id: repos
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/${{ github.repository }}"
            if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
              echo "${DOCKERHUB_USERNAME}/akhub"
            fi
          } > "$RUNNER_TEMP/repos.txt"
          {
            echo "list<<AKHUB_EOF"
            cat "$RUNNER_TEMP/repos.txt"
            echo "AKHUB_EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/repos.txt"

      - name: 登录镜像仓库
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "未配置 DOCKERHUB_TOKEN，只推 GHCR"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repos.outputs.list }}
          flavor: |
            latest=auto
            suffix=-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_release == 'true' }}

      - name: 构建并推送单架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=akhub-${{ matrix.arch }}
          cache-to: type=gha,scope=akhub-${{ matrix.arch }},mode=max

  # 把单架构镜像挂成不带后缀的 manifest（下游 compose 直接用这个 tag）。
  docker-manifest:
    name: 合成 manifest
    needs: [verify, docker]
    if: needs.verify.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: 取镜像仓库列表
        id: repos
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/${{ github.repository }}"
            if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
              echo "${DOCKERHUB_USERNAME}/akhub"
            fi
          } > "$RUNNER_TEMP/repos.txt"
          {
            echo "list<<AKHUB_EOF"
            cat "$RUNNER_TEMP/repos.txt"
            echo "AKHUB_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

      # 不带 suffix 地再算一次 tag 列表：这一步算出来的就是最终的多架构 tag。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repos.outputs.list }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_release == 'true' }}

      - name: 合成多架构 manifest
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "==> $tag"
            docker buildx imagetools create -t "$tag" "${tag}-amd64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: 复核最终 manifest
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "===== $tag"
            docker buildx imagetools inspect "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"