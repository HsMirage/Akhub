# 公开发版：推 v* tag 时产出桌面安装包 + Linux 单文件二进制 + 多架构 Docker 镜像。
#
# 挂到 Release 上的只有这几个（2026-10-01 起的口径）：
#   akhub-desktop-<tag>-macos-arm64.dmg            Apple Silicon 桌面端
#   akhub-desktop-<tag>-macos-x86_64.dmg           Intel Mac 桌面端
#   akhub-desktop-<tag>-windows-x86_64-setup.exe   Windows 桌面端（NSIS 安装器）
#   akhub-v<tag>-linux-x86_64.tar.gz               Linux 服务端
#   akhub-v<tag>-linux-aarch64.tar.gz              Linux 服务端（arm64）
#   checksums.txt                                  上面这些文件的 sha256
#
# macOS / Windows 不再发裸二进制：这两个平台的产品形态是桌面端应用。它们的二进制
# 仍然在各自的 runner 上编出来，但只作为桌面端的 sidecar 使用，不挂到 Release。
# Windows 的 .msi 也不再打——只留一个双击即装的 setup.exe，安装入口只有一个。
#
# 镜像推送到 GHCR（ghcr.io/<owner>/<repo>），配置了 Docker Hub 变量时再镜像一份过去。
#
# 管理后台必须在 cargo 之前构建：rust-embed 在编译期把它嵌进二进制。
name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发只跑构建，不发 Release（下面的 release job 判断了 ref 必须是 tag）。
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  # npm ci 比 npm install 慢一点，但可复现；发布链路不能容忍依赖漂移。
  NPM_CONFIG_FUND: "false"

jobs:
  # ---------------------------------------------------------------- 前置校验
  verify:
    name: 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag 必须与 Cargo.toml 的版本一致
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "非 tag 触发（${GITHUB_REF}），跳过版本校验"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag crate=$crate"
          if [[ "$tag" != "$crate" ]]; then
            echo "::error::tag v$tag 与 Cargo.toml 的 $crate 不一致；二进制里的 /admin 版本号和 --version 都会对不上"
            exit 1
          fi

      # 桌面端是独立 crate（desktop/），版本号手写在它自己的 Cargo.toml 里：
      # 一旦掉队，安装包版本与 .app 的 CFBundleShortVersionString 就会和服务端
      # 对不上。这里提前卡住，别等用户装完才发现。
      - name: desktop 版本必须与根 crate 一致
        run: |
          set -euo pipefail
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          desktop="$(grep -m1 '^version' desktop/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "crate=$crate desktop=$desktop"
          if [[ "$desktop" != "$crate" ]]; then
            echo "::error::desktop/Cargo.toml 的 $desktop 与根 Cargo.toml 的 $crate 不一致"
            exit 1
          fi

  # ---------------------------------------------------------------- 前端产物
  web:
    name: 管理后台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建
        working-directory: web
        run: |
          npm ci
          # 纯逻辑的行为断言（批量粘贴 Key 的切分规则）与构建同一份依赖，
          # 顺路跑一次；发版链路不接受"规则退化了没人发现"。
          npm test
          npm run build

      # 六个平台共用同一份前端产物：各平台分别 npm ci 会拖慢发版，也可能
      # 因为 registry 抖动产出版本不同的壳子。
      - uses: actions/upload-artifact@v4
        with:
          name: akhub-web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- 二进制
  # 五个平台都要编：Linux 的两份是发布资产，macOS / Windows 的三份是桌面端 sidecar
  # 的来源（见下面的 desktop job），编完只留在 workflow artifact 里，不上 Release。
  binaries:
    name: ${{ matrix.name }}
    needs: [web, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          # macOS 的 x86_64 直接从 arm64 runner 上交叉编译（SDK 本身是三架构的），
          # 比钉死某个即将退役的 Intel runner 标签稳。
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: akhub-web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 打包规则只在 scripts/package.sh 里定义一次：CI 与本地发版共用同一份
      # 实现，资产命名（akhub-<tag>-<platform>）与归档内层目录才不可能分叉。
      # Windows 上用 Git Bash 跑它；那边只产裸 exe，没有归档。
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          TAG="${GITHUB_REF_NAME:-v$VERSION}"
          BINARY="target/${{ matrix.target }}/release/akhub"
          if [[ "${{ matrix.target }}" == *windows* ]]; then BINARY="$BINARY.exe"; fi
          AKHUB_TAG="$TAG" ./scripts/package.sh \
            "${{ matrix.target }}" "${{ matrix.name }}" "$BINARY"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: akhub-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.exe
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- 桌面端
  # Tauri v2 外壳：sidecar 用的 akhub 二进制直接复用 binaries job 的发行工件
  # （macOS 的 .tar.gz / Windows 的裸 exe），不在这里重编译一遍——这样「桌面端里
  # 跑的 akhub」与用户手工下载的那个一定是同一份产物。
  #
  # 不签名（仓库没有 Apple Developer ID / Windows 代码签名证书）：macOS 首次打开
  # 需要右键「打开」或 xattr 放行，Windows 需要过 SmartScreen 的「仍要运行」。
  # 具体步骤写在 desktop/README.md。
  desktop:
    name: desktop-${{ matrix.name }}
    needs: [binaries]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary-asset: akhub-macos-aarch64
            bundles: app,dmg
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            binary-asset: akhub-macos-x86_64
            bundles: app,dmg
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-asset: akhub-windows-x86_64
            # 只打 NSIS：安装入口留一个就够，.msi 不再产出。
            bundles: nsis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary-asset }}
          path: sidecar-dist

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 桌面 crate 是独立 workspace，缓存也走它自己的 target/。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: desktop-${{ matrix.target }}

      - name: 安装 Tauri CLI
        working-directory: desktop
        run: npm ci

      # utilities-rust 的三元组命名只在这一个脚本里定义：CI 与本地共用同一份实现。
      - name: 准备 sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sidecar-raw
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            src="$(ls sidecar-dist/*.exe | head -n1)"
          else
            tar -xzf "$(ls sidecar-dist/*.tar.gz | head -n1)" -C sidecar-raw --strip-components=1
            src="sidecar-raw/akhub"
          fi
          echo "sidecar 来源：$src"
          ./desktop/prepare-sidecar.sh "${{ matrix.target }}" "$src"
          ls -l desktop/binaries

      - name: 构建桌面端
        working-directory: desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 产物统一改名成 akhub-desktop-<tag>-<platform>.<ext>：用户从 Release 页面
      # 一眼就能看出是哪个平台、什么版本。macOS 的 arm64 用 arm64 而不是目标三元组
      # 里的 aarch64：这是给下载者看的名字，跟构建目标名无关。
      - name: 归集产物
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          TAG="${GITHUB_REF_NAME:-v$VERSION}"
          BUNDLE="desktop/target/${{ matrix.target }}/release/bundle"
          # Tauri 在有 --target 时把产物放在 <target-dir>/<triple>/release/bundle；
          # 万一将来布局变了，退回到不带三元组的那层，避免整条发版卡在一个路径上。
          if [[ ! -d "$BUNDLE" ]]; then BUNDLE="desktop/target/release/bundle"; fi
          mkdir -p dist-desktop
          case "${{ matrix.target }}" in
            *windows*)
              cp "$BUNDLE"/nsis/*-setup.exe "dist-desktop/akhub-desktop-$TAG-${{ matrix.name }}-setup.exe"
              ;;
            aarch64-apple-darwin)
              cp "$BUNDLE"/dmg/*.dmg "dist-desktop/akhub-desktop-$TAG-macos-arm64.dmg"
              ;;
            *)
              cp "$BUNDLE"/dmg/*.dmg "dist-desktop/akhub-desktop-$TAG-${{ matrix.name }}.dmg"
              ;;
          esac
          ls -l dist-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: akhub-desktop-${{ matrix.name }}
          path: dist-desktop/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  release:
    name: 生成 Release
    # 桌面产物与 Linux 二进制进同一个 Release：checksums.txt 得把它们一起算上。
    needs: [binaries, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: akhub-*
          path: dist
          merge-multiple: true

      # 只对真正要发布的那几个文件算：下载下来的中间产物（macOS / Windows 的裸
      # 二进制）不挂 Release，也就不该出现在校验和里。
      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.txt
          shopt -s nullglob
          targets=(
            ./akhub-v*-linux-x86_64.tar.gz
            ./akhub-v*-linux-aarch64.tar.gz
            ./akhub-desktop-*-macos-arm64.dmg
            ./akhub-desktop-*-macos-x86_64.dmg
            ./akhub-desktop-*-windows-x86_64-setup.exe
          )
          shopt -u nullglob
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::没有匹配到任何发布产物，拒绝生成空的 checksums.txt"
            exit 1
          fi
          # 校验和文件本身不能被算进去。
          sha256sum "${targets[@]}" > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/akhub-v*-linux-x86_64.tar.gz
            dist/akhub-v*-linux-aarch64.tar.gz
            dist/akhub-desktop-*-macos-arm64.dmg
            dist/akhub-desktop-*-macos-x86_64.dmg
            dist/akhub-desktop-*-windows-x86_64-setup.exe
            dist/checksums.txt
          generate_release_notes: true
  # ---------------------------------------------------------------- 容器镜像
  # 每个架构在自己的原生 runner 上构建，再合成 manifest list。
  # 用 QEMU 模拟 arm64 跑 Rust + aws-lc-sys 的 C 编译会慢一个数量级，还容易超时。
  #
  # 单架构阶段先推 <tag>-<arch>，两个架构互不覆盖；多架构 tag 由后面的
  docker:
    name: 镜像 linux/${{ matrix.arch }}
    needs: [web]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` 是 GitHub 的 arm64 托管 runner，公开仓库免费。
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # 就地带上前端产物：Dockerfile 里的 node 阶段仍会重建一次，
      # 但这样 `docker build .` 这条本地路径和 CI 才完全同构。
      - uses: actions/download-artifact@v4
        with:
          name: akhub-web-dist
          path: web/dist

      - uses: docker/setup-buildx-action@v3

      # 用脚本而不是 `if: secrets.X != ''`：GitHub 明确不建议在表达式里
      # 引用 secret，空值判断在 shell 里做既可靠又不会把值打进日志。
      - name: 取镜像仓库列表
        id: repos
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/${{ github.repository }}"
            if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
              echo "${DOCKERHUB_USERNAME}/akhub"
            fi
          } > "$RUNNER_TEMP/repos.txt"
          {
            echo "list<<AKHUB_EOF"
            cat "$RUNNER_TEMP/repos.txt"
            echo "AKHUB_EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/repos.txt"

      - name: 登录镜像仓库
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "未配置 DOCKERHUB_TOKEN，只推 GHCR"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repos.outputs.list }}
          flavor: |
            latest=auto
            suffix=-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送单架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=akhub-${{ matrix.arch }}
          cache-to: type=gha,scope=akhub-${{ matrix.arch }},mode=max

  # 把两个架构的单架构镜像合成多架构 manifest。
  docker-manifest:
    name: 合成多架构 manifest
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: 取镜像仓库列表
        id: repos
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/${{ github.repository }}"
            if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
              echo "${DOCKERHUB_USERNAME}/akhub"
            fi
          } > "$RUNNER_TEMP/repos.txt"
          {
            echo "list<<AKHUB_EOF"
            cat "$RUNNER_TEMP/repos.txt"
            echo "AKHUB_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

      # 不带 suffix 地再算一次 tag 列表：这一步算出来的就是最终的多架构 tag。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repos.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 合成多架构 manifest
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "==> $tag"
            docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: 复核最终 manifest
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "===== $tag"
            docker buildx imagetools inspect "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"