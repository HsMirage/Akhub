# 公开仓库的质量门：格式、静态检查、全量测试、前端构建与容器冒烟。
# 前端产物必须在 cargo 之前构建：管理后台由 rust-embed 在编译期嵌入。
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建管理后台
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --check

      - name: 静态检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 全量测试
        run: cargo test --all --no-fail-fast

      # 发布脚本是运维唯一直接执行的东西，语法错误必须在这里拦下，
      # 而不是等用户在服务器上敲下去才发现。
      - name: 发布脚本语法
        run: |
          set -euo pipefail
          for script in install.sh scripts/*.sh deploy/docker-entrypoint.sh; do
            # 按 shebang 选解释器。Ubuntu 上 sh 是 dash：对 #!/bin/sh 的脚本
            # 这才算真正验证了 POSIX 兼容性（否则 bash 专有语法要等用户在
            # dash 环境下执行时才会以 "Syntax error" 暴露）；反过来，
            # bash 脚本必须用 bash -n，用 dash 去解析只会误报。
            case "$(head -n1 "$script")" in
              *bash*) echo "--- $script (bash)"; bash -n "$script" ;;
              *)      echo "--- $script (sh)";   sh -n "$script" ;;
            esac
          done

  # 容器冒烟：在空数据目录上首次启动、探测就绪、跑完一次真实 HTTP 请求。
  # 这是 §28 完成标准里的"Docker 从空数据目录完成首次启动和真实调用"，
  # 只有真的把镜像跑起来才算数——镜像能不能 build 成功说明不了这一点。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建运行镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true
          tags: akhub:ci
          cache-from: type=gha,scope=akhub-ci
          cache-to: type=gha,scope=akhub-ci,mode=max

      - name: 容器内首次启动与真实调用
        run: |
          set -euo pipefail

          # 空数据目录 + 命名卷，和用户的默认部署完全一致。
          docker run -d --name akhub-ci \
            -p 127.0.0.1:18080:8080 \
            -e RUST_LOG=akhub=info \
            akhub:ci

          cleanup() { docker logs akhub-ci || true; docker rm -f akhub-ci || true; }
          trap cleanup EXIT

          echo "==> 等待就绪（首次启动要在空目录里建库、生成主密钥）"
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/health/ready >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::容器 60 秒内没有就绪"
            exit 1
          fi

          echo "==> /health/version"
          version="$(curl -fsS http://127.0.0.1:18080/health/version)"
          echo "$version"
          # 版本必须与 Cargo.toml 一致，否则说明镜像里嵌的是别的构建。
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "$version" | grep -q "\"$crate\"" \
            || { echo "::error::镜像版本与 Cargo.toml 的 $crate 不一致：$version"; exit 1; }

          echo "==> 管理后台外壳"
          curl -fsS http://127.0.0.1:18080/admin | grep -qi '<div id="root">' \
            || { echo "::error::/admin 没有返回 SPA 外壳，前端可能没嵌进去"; exit 1; }

          echo "==> 未鉴权请求必须 401（网关真的在工作）"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}')"
          [[ "$code" == "401" ]] || { echo "::error::期望 401，实际 $code"; exit 1; }

          echo "==> 健康检查子命令（镜像 HEALTHCHECK 用的就是它）"
          docker exec akhub-ci /usr/local/bin/akhub --healthcheck

          echo "==> 服务进程不是 root"
          # 注意查的是 akhub 进程**自己**的 uid，不是 docker exec 的。
          # entrypoint 以 root 起步（为了能纠正 bind mount 的数据目录属主），
          # 随后用 gosu 降权；PID 1 是负责转发信号的 tini，它保持 root 是正常的。
          # 直接 `docker exec id -u` 拿到的是 exec 的 uid（沿用镜像 USER），
          # 那衡量不了服务进程以什么身份在跑。
          uids="$(docker exec akhub-ci sh -c 'for d in /proc/[0-9]*; do if [ "$(cat "$d/comm" 2>/dev/null)" = "akhub" ]; then awk "/^Uid:/{print \$2}" "$d/status"; fi; done' | sort -u)"
          echo "    akhub 进程 uid: ${uids:-（未找到）}"
          [[ "$uids" == "10001" ]] || { echo "::error::akhub 服务进程 uid=$uids，预期 10001"; exit 1; }

          echo "==> 数据目录内容"
          docker exec akhub-ci ls -la /data

          # 用户很自然会写 `docker run <镜像> --version`。命令行参数会覆盖
          # 镜像的 CMD，靠 entrypoint 把 "-" 开头的首个参数补成 akhub 的路径；
          # 少这一段就会变成 gosu 拿 "--version" 当可执行文件名去找。
          echo "==> 直接追加参数也能用"
          got="$(docker run --rm akhub:ci --version)"
          echo "    docker run akhub:ci --version => $got"
          [[ "$got" == akhub\ * ]] || { echo "::error::docker run --version 没有返回版本号：$got"; exit 1; }

          echo "全部通过"
